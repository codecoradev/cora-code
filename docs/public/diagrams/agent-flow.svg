<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d">
<title id="t">How an AI coding agent uses cora</title>
<desc id="d">The agent sends your prompt through the cora hook, which adds matching code from the index to the prompt the model sees; the model answers and can call the cora MCP server for deeper questions.</desc>
<style>
.bg{fill:#fcfcfb}
.box{fill:#f1f0ec;stroke:#d6d4ce;stroke-width:1.5}
.core{fill:#e9f1fc;stroke:#2a78d6;stroke-width:2}
.inner{fill:#fcfcfb;stroke:#b9c9e3;stroke-width:1.2}
.t1{font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0b0b0b}
.t2{font:400 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#52514e}
.tc{font:700 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1d5fb4}
.lbl{font:600 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.08em;fill:#52514e}
.val{font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0b0b0b}
.arrow{stroke:#52514e;stroke-width:1.6;fill:none}
.dash{stroke:#52514e;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.head{fill:#52514e}
.grid{stroke:#e2e1dc;stroke-width:1}
.axis{stroke:#52514e;stroke-width:1.2}
.bar{fill:#2a78d6}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}
.box{fill:#252523;stroke:#3a3a37}
.core{fill:#17263a;stroke:#3987e5}
.inner{fill:#1a1a19;stroke:#2f4666}
.t1{fill:#f0efec}
.t2{fill:#c3c2b7}
.tc{fill:#7db2f0}
.lbl{fill:#c3c2b7}
.val{fill:#f0efec}
.arrow{stroke:#c3c2b7}
.dash{stroke:#c3c2b7}
.head{fill:#c3c2b7}
.grid{stroke:#33332f}
.axis{stroke:#c3c2b7}
.bar{fill:#3987e5}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker></defs>
<rect width="760" height="470" rx="14" class="bg"/>
<rect x="20" y="28" width="330" height="100" rx="10" class="box"/>
<text x="185.0" y="66" class="t1" text-anchor="middle">1  Your prompt</text>
<text x="185.0" y="96" class="t2" text-anchor="middle">“where do we retry failed requests?”</text>
<rect x="410" y="28" width="330" height="100" rx="10" class="box"/>
<text x="575.0" y="66" class="t1" text-anchor="middle">2  Agent</text>
<text x="575.0" y="96" class="t2" text-anchor="middle">Claude Code · Hermes · pi</text>
<text x="575.0" y="118" class="t2" text-anchor="middle">omp · opencode</text>
<path d="M352 78.0L408 78.0" class="arrow" marker-end="url(#ah)"/>
<path d="M575.0 130L575.0 186" class="arrow" marker-end="url(#ah)"/>
<rect x="410" y="188" width="330" height="100" rx="10" class="core"/>
<text x="575.0" y="226" class="t1" text-anchor="middle">3  cora hook context</text>
<text x="575.0" y="256" class="t2" text-anchor="middle">finds matching symbols</text>
<text x="575.0" y="278" class="t2" text-anchor="middle">silent if nothing matches</text>
<rect x="20" y="188" width="330" height="100" rx="10" class="box"/>
<text x="185.0" y="226" class="t1" text-anchor="middle">4  Model</text>
<text x="185.0" y="256" class="t2" text-anchor="middle">sees prompt + code context</text>
<text x="185.0" y="278" class="t2" text-anchor="middle">then answers or calls tools</text>
<path d="M408 238.0L352 238.0" class="arrow" marker-end="url(#ah)"/>
<rect x="20" y="348" width="720" height="92" rx="10" class="box"/>
<text x="380.0" y="382" class="t1" text-anchor="middle">cora MCP server · 22 tools</text>
<text x="380.0" y="410" class="t2" text-anchor="middle">brain_search · find_callers · find_impact</text>
<text x="380.0" y="432" class="t2" text-anchor="middle">review_prepare · scan_prepare ...</text>
<path d="M169.0 290L169.0 346" class="arrow" marker-end="url(#ah)"/>
<path d="M201.0 346L201.0 290" class="arrow" marker-end="url(#ah)"/>
<text x="215.0" y="322" class="t2" text-anchor="start">tool calls</text>
</svg>
