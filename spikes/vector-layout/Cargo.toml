# Throwaway spike (not part of the cora build): one global vector file for all
# projects, or one file per project? Compares quality, speed and memory.
[package]
name = "vector-layout-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "local-only"] }
serde_json = "1"
usearch = "2"
vecq-core = "0.3"

[profile.release]
debug = false
