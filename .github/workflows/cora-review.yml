name: Cora AI Code Review

on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: cora-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  cora-review:
    name: Cora Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SECURITY: this job checks out untrusted PR code while holding
      # CORA_API_KEY (pull_request_target). A PR-supplied .cora.yaml could set
      # provider.base_url and exfiltrate the key. CORA_BASE_URL (env) always
      # takes precedence over project config, so require it to be pinned.
      - name: Require pinned CORA_BASE_URL
        env:
          CORA_BASE_URL: ${{ secrets.CORA_BASE_URL }}
        run: |
          if [ -z "$CORA_BASE_URL" ]; then
            echo "::error::Secret CORA_BASE_URL must be set so a PR-supplied .cora.yaml cannot redirect the API key."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Cora AI Code Review
        uses: codecoradev/cora-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cora-api-key: ${{ secrets.CORA_API_KEY }}
          cora-base-url: ${{ secrets.CORA_BASE_URL }}
          cora-model: ${{ secrets.CORA_MODEL }}
