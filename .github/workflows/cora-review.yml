name: Cora AI Code Review

on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: cora-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  cora-review:
    name: Cora Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SECURITY: this job checks out untrusted PR code while holding
      # CORA_API_KEY (pull_request_target). A PR-supplied .cora.yaml could set
      # provider.base_url and exfiltrate the key. CORA_BASE_URL (env) always
      # takes precedence over project config, so require it to be pinned.
      - name: Require the review secrets
        env:
          CORA_API_KEY: ${{ secrets.CORA_API_KEY }}
          CORA_BASE_URL: ${{ secrets.CORA_BASE_URL }}
          CORA_MODEL: ${{ secrets.CORA_MODEL }}
        run: |
          # An empty secret must fail the job: a skipped or fallback review is not a pass.
          missing=0
          for name in CORA_API_KEY CORA_BASE_URL CORA_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing. Cora Review cannot run, and that must not pass silently."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Cora AI Code Review
        uses: codecoradev/cora-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cora-api-key: ${{ secrets.CORA_API_KEY }}
          cora-base-url: ${{ secrets.CORA_BASE_URL }}
          cora-model: ${{ secrets.CORA_MODEL }}
