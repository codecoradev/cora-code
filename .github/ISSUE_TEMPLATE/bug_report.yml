name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below — it makes triage much faster.

        For **security issues**, do NOT open an issue. See [SECURITY.md](https://github.com/codecoradev/cora-code/blob/develop/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Cora version
      description: Run `cora --version` or check the release you're on.
      placeholder: "0.13.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Ubuntu 24.04 / macOS 15.2 / Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command?
      options:
        - cora review
        - cora scan
        - cora index
        - cora dead-code
        - cora rules
        - cora config
        - cora install (pre-commit hook)
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list of exact steps. Include the exact command.
      placeholder: |
        1. Run `cora review --base origin/develop`
        2. Observe error output
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Paste relevant terminal output. Use `RUST_LOG=debug cora review` for more detail.

  - type: textarea
    id: config
    attributes:
      label: Config (if relevant)
      description: Paste your `.cora.yaml` or `cora config show` output, redacting API keys.
      placeholder: |
        # rules_engine:
        #   index_skip_files:
        #     - "vite.config.ts"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I am running the latest version
          required: false
